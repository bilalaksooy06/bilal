name: MeowBot APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Testler
        run: gradle -p android :core:test --console=plain

      - name: APK derle
        run: gradle -p android :app:assembleRelease --console=plain

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk MeowBot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeowBot-apk
          path: MeowBot.apk

      - name: Releases sayfasına koy (telefondan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete meowbot-latest --cleanup-tag --yes || true
          gh release create meowbot-latest MeowBot.apk \
            --target "${{ github.sha }}" \
            --title "MeowBot (son sürüm)" \
            --notes "Telefondan MeowBot.apk dosyasına dokunarak indir ve kur. Derleme: ${{ github.sha }}"
